<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout</title>
  <script src="__FLYWIRE_SDK_URL__"></script>
  <script type="module" src="/checkout.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 16px; background: #fff; color: #111; }
    .env { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; background: #fde68a; }
    .env[data-env="production"] { background: #bbf7d0; }
    /* The Flywire SDK sizes its iframe at height:100% of this container (recommended ~1010x660px). */
    #flywire-container { margin-top: 1rem; height: 1010px; max-width: 660px; }
    #flywire-container:empty { height: auto; }
    iframe.flywire-form { border: 0; width: 100%; max-width: 660px; height: 1010px; background: #fff; }
    #status { margin-top: 1rem; min-height: 1.5em; }
  </style>
</head>
<body data-flywire-config="__FLYWIRE_CONFIG__">
  <h1>Checkout <span class="env" id="env"></span></h1>
  <label>Order ID <input id="order-id" value="demo-order-1" autocomplete="off"></label>
  <button id="pay" type="button">Pay with Flywire</button>
  <div id="flywire-container"></div>
  <p id="status" role="status" aria-live="polite"></p>
</body>
</html>
