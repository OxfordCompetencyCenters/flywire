[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "flywire-checkout"
version = "0.1.0"
description = "Typed, secure Python integration for the Flywire Checkout Sessions API (Education)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic[email]>=2.6,<3.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.0",
    "fastapi>=0.110",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flywire_checkout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
